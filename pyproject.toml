[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "determinism-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented Python determinism claims"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
determinism-claim-audit = "determinism_claim_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
